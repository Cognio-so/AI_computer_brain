[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-computer-brain"
version = "0.1.0"
description = "Self-hosted, multi-tenant MCP second brain that keeps every AI agent in a company in sync"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "AI Computer Brain contributors" }]
keywords = ["mcp", "agents", "second-brain", "knowledge-base", "multi-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.10",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "redis>=5.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "pypdf>=4.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Cognio-so/AI_computer_brain"
Repository = "https://github.com/Cognio-so/AI_computer_brain"
Documentation = "https://github.com/Cognio-so/AI_computer_brain/tree/main/docs"

[project.scripts]
brain = "second_brain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "second_brain/templates"
"sql" = "second_brain/sql"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
